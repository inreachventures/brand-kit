name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: No em-dashes
        run: |
          ! grep -rn $'\xe2\x80\x94' --exclude-dir=.git --exclude-dir=.venv .
      - run: python tools/build_zip.py dist/brand-kit.zip
